id: plan_then_execute
name: Plan-then-Execute
kind: family
schema_version: 1
version: 1
status: active
description: >
  Draft an implementation plan, get approval or checkpoint, then execute the
  approved steps without re-litigating scope each turn.
when_to_use:
  - Multi-file or architectural changes that benefit from an upfront plan
  - Tasks where edits should wait until scope and approach are explicit
  - Risky refactors that need a readable checklist before touching code
anti_criteria:
  - A one-line fix or typo with no planning overhead
  - The user asked for immediate iteration without a written plan
  - Mid-task replanning is required because requirements keep shifting
steps:
  - id: plan
    description: Produce a concrete step list and affected files before any edit.
  - id: execute
    description: Work through approved steps, checking each off as it completes.
allowed_tools:
  - read_file
  - edit
  - search
  - shell
  - git
  - run_tests
  - run_lint
required_capabilities: []
expected_cost_class: High
expected_steps: "2-30"
runner: plan_then_execute